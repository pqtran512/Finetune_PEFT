model_id: codellama/CodeLlama-7b-hf
# Evol + Magicoder-Evol Java → method-body completion (data/build_evol_completion_dataset.py)
data_path: data/jsonl/evol_java_completion_train.jsonl
output_dir: models/java-codellama-lora/evol_completion_bo
max_length: 1024
proxy_train_fraction: 0.08
proxy_epochs: 1
n_trials: 40
study_name: codellama_qlora_bo
study_db: train/studies/codellama_bo.db
best_params_path: train/studies/best_params.json
trial_output_root: models/java-codellama-lora/bo_trials
eval_test_size: 0.02
eval_seed: 42
neftune_noise_alpha: 5
search_space:
  learning_rate:
    type: loguniform
    low: 1.0e-5
    high: 3.0e-4
  weight_decay:
    type: uniform
    low: 0.0
    high: 0.1
  warmup_ratio:
    type: uniform
    low: 0.01
    high: 0.1
  lora_dropout:
    type: uniform
    low: 0.0
    high: 0.1
  lora_r:
    type: categorical
    choices: [8, 16, 32, 64]
  gradient_accumulation_steps:
    type: categorical
    choices: [8, 16, 32]
